# https://taskfile.dev

version: '3'

env:
  # Disable calls to CGO, so that the binaries compiled are static.
  CGO_ENABLED: "0"

vars:
  GIT_REFSPEC:
    sh: "git rev-parse --short HEAD"

tasks:
  release/cli:
    desc: "Build CLI release archives and SHA-256 checksums"
    cmds:
      - |
        set -euo pipefail
        version=${RELEASE_VERSION:-$(git rev-parse --short HEAD)}
        release_dir="$PWD/dist/cli-release"
        mkdir -p "$release_dir"
        scratch=$(mktemp -d)
        trap 'rm -rf "$scratch"' EXIT

        # Match bin/all; explicitly target ARMv7 for Linux ARM.
        for target in linux_amd64 linux_arm64 linux_arm darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            os=${target%_*}
            arch=${target#*_}
            binary=@
            if [[ "$os" == windows ]]; then
                binary=@.exe
            fi
            mkdir "$scratch/$target"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 go build \
                -trimpath \
                -ldflags "-X github.com/andrewhowdencom/x40.link/version.Version=$version" \
                -o "$scratch/$target/$binary" ./cli
            tar -czf "$scratch/x40-cli_${target}.tar.gz" -C "$scratch/$target" "$binary"
        done

        # Use relative filenames so users can verify downloaded archives.
        cd "$scratch"
        sha256sum x40-cli_*.tar.gz > SHA256SUMS
        cp x40-cli_*.tar.gz SHA256SUMS "$release_dir/"

  release/cli/test:
    desc: "Test the CLI and verify release archives for every supported platform"
    cmds:
      - task: release/cli
      - |
        set -euo pipefail
        cd dist/cli-release
        sha256sum --check SHA256SUMS
        test "$(wc -l < SHA256SUMS)" -eq 7

        scratch=$(mktemp -d)
        trap 'rm -rf "$scratch"' EXIT
        for target in linux_amd64 linux_arm64 linux_arm darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            os=${target%_*}
            arch=${target#*_}
            binary=@
            if [[ "$os" == windows ]]; then
                binary=@.exe
            fi
            archive="x40-cli_${target}.tar.gz"
            test "$(tar -tzf "$archive")" = "$binary"
            mkdir "$scratch/$target"
            tar -xzf "$archive" -C "$scratch/$target"
            metadata=$(go version -m "$scratch/$target/$binary")
            grep -F "GOOS=$os" <<< "$metadata"
            grep -F "GOARCH=$arch" <<< "$metadata"
        done

        # Smoke-test the host platform without making API calls.
        host="$(go env GOOS)_$(go env GOARCH)"
        binary=@
        if [[ "$host" == windows_* ]]; then
            binary=@.exe
        fi
        "$scratch/$host/$binary" --help > /dev/null
        "$scratch/$host/$binary" login --help > /dev/null
        "$scratch/$host/$binary" resolve --help > /dev/null
        "$scratch/$host/$binary" list --help > /dev/null
      - go test ./cli/...

  bin:
    desc: "Build a go binary specific to an architecture and operating system"
    requires:
      vars: [GOOS, GOARCH]
    cmds:
      # Generate the required files
      - mkdir -p "dist/{{ .GOOS }}+{{ .GOARCH }}"
      # Inject the build-time version into the binary so the OTel
      # service.version resource attribute carries the value populated
      # by the build pipeline (typically GIT_REFSPEC).
      - go build -ldflags "-X github.com/andrewhowdencom/x40.link/version.Version={{ .GIT_REFSPEC }}" -o "dist/{{ .GOOS }}+{{ .GOARCH }}/x40.link{{ exeExt }}" main.go
      - go build -ldflags "-X github.com/andrewhowdencom/x40.link/version.Version={{ .GIT_REFSPEC }}" -o "dist/{{ .GOOS }}+{{ .GOARCH }}/@{{ exeExt }}" cli/main.go 

  bin/all:
    desc: "Builds the go binaries"
    deps:
      - "bin/clean"
    summary: |
      Builds the go binaries

      Generates go binaries for all supported operating systems, and stores them under "dist/"
      with the appropriate suffix.
    cmds:
      - for:
        # Linux (both Intel and ARM)
        - GOOS: "linux"
          GOARCH: "amd64"
        - GOOS: "linux"
          GOARCH: "arm64"

        # Raspberry Pi
        - GOOS: "linux"
          GOARCH: "arm"

        # MacOS (Older Intel & Newer ARM)
        - GOOS: "darwin"
          GOARCH: "amd64"
        - GOOS: "darwin"
          GOARCH: "arm64"

        # Windows
        - GOOS: "windows"
          GOARCH: "amd64"
        - GOOS: "windows"
          GOARCH: "arm64"

        task: bin
        vars:
          GOOS: "{{ .ITEM.GOOS }}"
          GOARCH: "{{ .ITEM.GOARCH }}"

  bin/clean:
    desc: "Clean the generated artifacts"
    cmds:
      - "rm -rf dist"

  cloudrun/apply:
    desc: "Deploy the latest state to CloudRun"
    cmds:
      - cat deploy/prod/cr/service.yaml | envsubst | gcloud run services replace -
    env:
      VERSION: "{{ .GIT_REFSPEC }}"

  container/all:
    desc: "Build and push containers to all registries"
    cmds:
      - for:
        - REGISTRY: "europe-west3-docker.pkg.dev/andrewhowdencom/x40-link"
        - REGISTRY: "ghcr.io/x40-link"
        task: "container"
        vars:
          REGISTRY: "{{ .ITEM.REGISTRY }}"

  container:
    desc: "Build and push a container to a registry"
    cmds:
      - task: "container/build"
        vars: { "REGISTRY": "{{ .REGISTRY }}"}
      - task: "container/push"
        vars: { "REGISTRY": "{{ .REGISTRY }}"}

  container/build:
    desc: "Build the container for the application"
    cmds:
      - |
        podman build \
          --format docker \
          --build-arg VERSION="{{ .GIT_REFSPEC }}" \
          --build-arg CREATED='{{now | date "2006-01-02T15:04:05Z07:00"}}' \
          --tag {{ .REGISTRY | default "localhost" }}/x40.link:{{ .GIT_REFSPEC }} \
          .

  container/push:
    desc: "Push the container"
    requires:
      vars: ["REGISTRY"]
    cmds:
      - |
        podman push \
          --remove-signatures \
          {{ .REGISTRY }}/x40.link:{{ .GIT_REFSPEC }}

  docs:
    desc: "Build the static HTML for the documentation"
    summary: |
      Generate the static HTML for the documentation

      This documentation will then be deployed to x40.app (or similar) so that it can be viewed by people looking
      to reproduce the service.
    dir: "./docs"
    deps: ["docs/clean", "docs/install"]
    cmds:
      - "poetry run mkdocs build"

  docs/clean:
    desc: "Clean the generated documentation"
    dir: "./docs"
    cmds:
      - "rm -rf docs/content"

  docs/install:
    desc: "Install the dependencies required for the documentation"
    dir: "./docs"
    cmds:
      - "poetry install --no-root"

  docs/tar:
    desc: "Package the documentation for release"
    deps: ["docs"]
    cmds:
      - mkdir -p dist
      - |
        tar \
            --dereference --hard-dereference \
            --directory docs/site/ \
            -cvf dist/docs.tar.gz \
            .

  docs/view:
    desc: "View the documentation on the local machine"
    dir: "./docs"
    cmds:
      - "poetry run mkdocs serve"

  tofu/plan:
    desc: "Plan the infrastructure changes, and validate their output"
    requires:
      vars: [ENV]
    dir: "deploy/{{ .ENV }}/tf"
    cmds:
      - "tofu plan -out next.planfile"

  tofu/apply:
    requires:
      vars: [ENV]
    desc: "Apply previously designed infrastructure changes"
    dir: "deploy/{{ .ENV }}/tf"
    cmds:
      - "tofu apply next.planfile"

  lint:
    desc: "Validate the code against common standards"
    cmds:
      # Containers
      - hadolint Containerfile

      # Golang
      - task: lint/go

  lint/go:
    desc: "Run Go linters"
    cmds:
      - golangci-lint run ./...

  validate:
    desc: "Run the local Go test, lint, and build gates"
    cmds:
      - task: test
      - task: lint/go
      - go build ./...

  test:
    env:
      CGO_ENABLED: 1
    desc: "Run the default set of unit tests"
    cmds:
      - go test ./... -test.v -race -vet=all

  tools/apt/install:
    desc: "Install a series of tools via aptitude"
    cmds:
      # Required for unit tests
      - apt-get update
      - apt-get install google-cloud-sdk-firestore-emulator
